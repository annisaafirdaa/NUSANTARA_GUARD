<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>NUSANTARA GUARD – Digital Intelligence for National Sovereignty</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050d1f;--bg2:#0a1830;--pn:rgba(14,32,62,.62);--bd:rgba(120,200,230,.16);--tx:#e8f1fa;--mu:#8ea6c0;--cy:#22d3ee;--tl:#2dd4bf;--rd:#ef4444;--am:#fbbf24;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#0d2a4d 0,var(--bg) 60%);color:var(--tx);font:15px/1.6 'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(5,13,31,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:18px;padding:10px 20px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(5,13,31,.85);z-index:30}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:14px;white-space:nowrap;cursor:pointer}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}nav a{color:var(--mu);text-decoration:none;padding:7px 12px;border-radius:8px;font-size:13.5px;white-space:nowrap;transition:.2s}nav a:hover{color:var(--tx)}nav a.on{color:var(--cy);background:rgba(34,211,238,.1)}
.demo{font-size:11px;border:1px solid var(--am);color:var(--am);padding:2px 8px;border-radius:99px;white-space:nowrap}
main{max-width:1240px;margin:0 auto;padding:24px 20px 60px}.pg{display:none;animation:in .4s}.pg.on{display:block}@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1{font-size:clamp(30px,5vw,54px);line-height:1.1;margin:0 0 16px;font-weight:800}h2{font-size:24px;margin:0 0 6px}h3{font-size:16px;margin:0 0 8px}p{margin:0 0 12px;color:#b9cbe0}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:18px;backdrop-filter:blur(8px)}
.g{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.mapw{grid-template-columns:1fr 340px}
@media(max-width:900px){.g4,.g3{grid-template-columns:1fr 1fr}.g2,.mapw{grid-template-columns:1fr}}@media(max-width:560px){.g4,.g3{grid-template-columns:1fr}header{flex-wrap:wrap}}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center;padding:30px 0}@media(max-width:900px){.hero{grid-template-columns:1fr}}
.hl{color:var(--cy)}.btn{background:linear-gradient(135deg,var(--cy),var(--tl));color:#03121f;border:0;padding:11px 20px;border-radius:10px;font:700 14px inherit;font-family:inherit;cursor:pointer;margin:0 8px 8px 0;transition:.2s}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn.o{background:transparent;color:var(--cy);border:1px solid var(--cy)}.btn.s{padding:6px 12px;font-size:12.5px}
.stat b{font-size:32px;display:block}.stat small{color:var(--mu)}.up{color:var(--am);font-size:12px}.dn{color:var(--tl);font-size:12px}
select,input[type=text],input[type=search]{background:#0a1a33;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;max-width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
svg.map{width:100%;height:auto;background:#06142b;border-radius:12px;border:1px solid var(--bd)}svg.map path.isl{fill:#0f2e50;stroke:#3aa7c4;stroke-width:.8;filter:drop-shadow(0 0 4px rgba(34,211,238,.35))}
.mk{cursor:pointer;stroke:#04101e;stroke-width:1}.mk:hover{stroke:#fff;stroke-width:2}.pulse{animation:p 1.8s infinite;transform-box:fill-box;transform-origin:center}@keyframes p{50%{opacity:.35;transform:scale(1.7)}}
.lg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.lg span{cursor:pointer;font-size:12px;padding:4px 9px;border:1px solid var(--bd);border-radius:99px;display:inline-flex;gap:6px;align-items:center}.lg span.off{opacity:.35}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:500}.tw{overflow-x:auto}
.tag{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}.HIGH{background:rgba(239,68,68,.18);color:#fca5a5;border:1px solid var(--rd)}.MEDIUM{background:rgba(251,191,36,.15);color:var(--am);border:1px solid var(--am)}.LOW{background:rgba(45,212,191,.13);color:var(--tl);border:1px solid var(--tl)}
.hb{height:8px;background:#0a1a33;border-radius:9px;overflow:hidden;margin:3px 0 8px}.hb i{display:block;height:100%;background:linear-gradient(90deg,var(--tl),var(--cy))}
.note{border-left:3px solid var(--am);background:rgba(251,191,36,.07);padding:10px 14px;border-radius:0 10px 10px 0;font-size:13px;margin-bottom:16px;color:#e8d9a8}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.flow div{background:var(--pn);border:1px solid var(--cy);padding:8px 12px;border-radius:10px;font-size:13px}.flow em{color:var(--cy);font-style:normal}
.al{border-left:4px solid var(--bd)}.al.HIGH{border-left-color:var(--rd)}.al.MEDIUM{border-left-color:var(--am)}.al.LOW{border-left-color:var(--tl)}.al{margin-bottom:12px}
footer{text-align:center;color:var(--mu);font-size:12px;padding:20px}.pad{padding:6px 0}
@media print{header,.bar,.btn,footer{display:none!important}body{background:#fff;color:#000}.pn{border-color:#999;background:#fff}p,td,th{color:#000}}
</style></head><body>
<header><div class="logo" onclick="location.hash='beranda'"><svg width="30" height="30" viewBox="0 0 30 30"><path d="M15 2 4 7v8c0 7 5 11 11 13 6-2 11-6 11-13V7z" fill="none" stroke="#22d3ee" stroke-width="2"/><circle cx="15" cy="14" r="3" fill="#2dd4bf"/><path d="M9 14h12M15 8v12" stroke="#22d3ee" stroke-width="1" opacity=".6"/></svg>NUSANTARA GUARD</div>
<nav id="nav"></nav><span class="demo">PROTOTYPE · DATA SIMULASI</span></header>
<main id="m"></main>
<footer>NUSANTARA GUARD adalah prototipe konseptual. Seluruh data pada situs ini adalah <b>SIMULASI</b>; tidak terhubung ke sistem pertahanan, satelit pemerintah, atau data rahasia negara.</footer>
<script>
// ===== DATA SIMULASI (seeded, konsisten di semua halaman) =====
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(2026),MON=['Mei','Jun','Jul','Agu','Sep','Okt'];
const REG=[['Sumatra',101,-0.5,'Perairan Selat Malaka (area simulasi)'],['Jawa',110.5,-7.4,'Pesisir Utara Jawa (area simulasi)'],['Kalimantan',114,0,'Kawasan Hulu Sungai (area simulasi)'],['Sulawesi',121,-2,'Perairan Laut Sulawesi (area simulasi)'],['Bali–Nusa Tenggara',120,-8.8,'Selat Lombok–Flores (area simulasi)'],['Maluku',128,-3,'Laut Banda (area simulasi)'],['Papua',136,-4,'Pesisir Selatan Papua (area simulasi)'],['Laut Natuna',108,4,'Perairan Natuna Utara (area simulasi)']];
const CAT=[['mar','Aktivitas maritim','#22d3ee'],['lan','Perubahan penggunaan lahan','#34d399'],['ile','Potensi aktivitas ilegal (dataset demo)','#ef4444'],['lin','Perubahan lingkungan & SDA','#60a5fa'],['pri','Area prioritas pemantauan','#fbbf24']];
const CN=Object.fromEntries(CAT.map(c=>[c[0],c[1]])),CC=Object.fromEntries(CAT.map(c=>[c[0],c[2]]));
const FEAT=['Frekuensi aktivitas jauh di atas baseline wilayah','Pola lokasi menyimpang dari sebaran historis','Waktu kejadian di luar pola musiman'];
const REC={mar:'Verifikasi silang dengan data pelaporan pelabuhan dan citra resmi; koordinasikan dengan instansi maritim berwenang.',lan:'Bandingkan dengan peta tutupan lahan terbaru dan izin tata ruang; lakukan pengecekan lapangan bila perlu.',ile:'Teruskan sebagai bahan verifikasi kepada pihak berwenang; hindari kesimpulan sebelum ada konfirmasi lapangan.',lin:'Cocokkan dengan data BMKG/KLHK dan musim setempat untuk memisahkan variasi alami dari perubahan tidak biasa.',pri:'Pertahankan frekuensi pemantauan dan tinjau ulang prioritas area pada siklus laporan berikutnya.'};
const D=[];for(let i=0;i<64;i++){const r=Math.floor(R()*8),c=CAT[Math.floor(R()*5)][0],m=Math.floor(R()*6),f=[R(),R(),R()];if(R()<.2)f[0]=.75+R()*.25;if(c==='ile')f[1]=Math.min(1,f[1]+.2);
const s=Math.min(.99,.5*f[0]+.3*f[1]+.2*f[2]);const g=REG[r];
D.push({id:'NG-'+String(1001+i),r,reg:g[0],cat:c,m,d:1+Math.floor(R()*28),lon:g[1]+(R()-.5)*3,lat:g[2]+(R()-.5)*2.2,place:g[3],f,s:+s.toFixed(2),ver:['Belum diverifikasi','Dalam verifikasi','Terverifikasi (simulasi)'][Math.floor(R()*3)],st:'Baru'})}
const pr=s=>s>=.6?'HIGH':s>=.4?'MEDIUM':'LOW';D.forEach(x=>x.p=pr(x.s));
const dt=x=>`${String(x.d).padStart(2,'0')} ${MON[x.m]} 2026`;
const LOG=[];let TH=.6,RUNS=[{t:'Eksekusi awal (data simulasi)',n:D.filter(x=>x.s>=.6).length}];
// ===== helpers =====
const $=s=>document.querySelector(s),F={reg:'',cat:'',per:'',q:'',hid:new Set()};
const flt=(o={})=>D.filter(x=>(!F.reg||x.r==F.reg)&&(!F.cat||x.cat==F.cat)&&(F.per===''||x.m==F.per)&&(!F.q||(x.reg+x.place+x.id+CN[x.cat]).toLowerCase().includes(F.q.toLowerCase()))&&!(o.layers&&F.hid.has(x.cat)));
const opt=(a,v,al)=>`<option value="">${al}</option>`+a.map(([k,l])=>`<option value="${k}"${v==k?' selected':''}>${l}</option>`).join('');
function bar(extra=''){return`<div class="bar"><input type="search" id="fq" placeholder="Cari wilayah / ID / kategori" value="${F.q}"><select id="fr">${opt(REG.map((g,i)=>[i,g[0]]),F.reg,'Semua wilayah')}</select><select id="fc">${opt(CAT.map(c=>[c[0],c[1]]),F.cat,'Semua kategori')}</select><select id="fp">${opt(MON.map((m,i)=>[i,m+' 2026']),F.per,'Semua periode')}</select>${extra}<button class="btn o s" id="frs">Reset filter</button></div>`}
function bindBar(){const u=()=>{F.q=$('#fq').value;F.reg=$('#fr').value;F.cat=$('#fc').value;F.per=$('#fp').value;render(true)};$('#fq').oninput=()=>{u();const e=$('#fq');e.focus();e.setSelectionRange(e.value.length,e.value.length)};['#fr','#fc','#fp'].forEach(s=>$(s).onchange=u);$('#frs').onclick=()=>{F.reg=F.cat=F.per=F.q='';F.hid.clear();render()}}
const ISL=[[[95.3,5.5],[98,4],[100,2],[103.5,-1],[106,-3.5],[105.8,-5.8],[104,-5.5],[101,-3],[98.5,0],[96,2.5]],[[105.2,-6.8],[108,-6.3],[111,-6.6],[114.4,-7.7],[114.4,-8.7],[111,-8.3],[108,-7.8],[105.5,-7]],[[108.9,1.5],[110,2],[111.5,1.5],[114,4.3],[117.5,6.5],[119,5],[118,1],[117.5,-1],[116,-3.8],[114.5,-4],[111.5,-3.3],[110,-3],[109,-1]],[[119,-5.5],[119.5,-3],[119.8,0],[120,1],[121,1],[123,.8],[125,1.5],[124.5,.3],[122,.5],[121.5,-1],[123,-1],[123,-2.5],[122,-4.5],[121,-3],[120.5,-5.5]],[[131,-.8],[134,-.7],[135,-3],[138,-1.5],[141,-2.6],[141,-9],[138.5,-8.3],[137.5,-5],[135,-4],[132.5,-4],[133,-2.5]],[[115.2,-8.3],[119,-8.5],[123,-8.4],[125,-9.2],[123,-10.2],[119,-9],[115.2,-8.8]],[[126.5,-3.8],[128.5,-3.2],[128.5,-3.9]],[[127.5,1.5],[128.5,1.2],[128.2,-.8],[127.5,-.5]],[[120.5,-8.5],[121,-10.3],[123,-10.2]]];
const X=l=>(l-95)/46*1000,Y=l=>(7-l)/18*392;
function mapSVG(a,o={}){let s=`<svg class="map" viewBox="0 0 1000 392" role="img" aria-label="Peta digital Indonesia (skematis)">`;for(let l=95;l<=140;l+=5)s+=`<line x1="${X(l)}" x2="${X(l)}" y1="0" y2="392" stroke="#16365a" stroke-width=".5"/>`;for(let l=6;l>=-10;l-=4)s+=`<line y1="${Y(l)}" y2="${Y(l)}" x1="0" x2="1000" stroke="#16365a" stroke-width=".5"/>`;
s+=ISL.map(p=>`<path class="isl" d="M${p.map(q=>X(q[0]).toFixed(1)+','+Y(q[1]).toFixed(1)).join('L')}Z"/>`).join('');
if(o.net){const c=REG.map(g=>[X(g[1]),Y(g[2])]);for(let i=0;i<c.length;i++)for(let j=i+1;j<c.length;j++)if(Math.hypot(c[i][0]-c[j][0],c[i][1]-c[j][1])<300)s+=`<line x1="${c[i][0]}" y1="${c[i][1]}" x2="${c[j][0]}" y2="${c[j][1]}" stroke="#22d3ee" stroke-opacity=".35" stroke-dasharray="3 4"/>`}
a.forEach(x=>{const cx=X(x.lon).toFixed(1),cy=Y(x.lat).toFixed(1);if(x.p==='HIGH')s+=`<circle class="pulse" cx="${cx}" cy="${cy}" r="9" fill="none" stroke="#ef4444" stroke-width="1.5"/>`;s+=`<circle class="mk" data-id="${x.id}" cx="${cx}" cy="${cy}" r="${o.net?3:5.5}" fill="${CC[x.cat]}"/>`});
s+=`<text x="12" y="380" fill="#5f7c9c" font-size="11">Peta skematis · titik adalah lokasi SIMULASI tingkat wilayah, bukan koordinat sebenarnya</text></svg>`;return s}
const line=(v,l,col='#22d3ee')=>{const W=520,H=180,m=Math.max(...v,1),p=v.map((y,i)=>[30+i*(W-50)/(v.length-1||1),H-24-y/m*(H-50)]);return`<svg viewBox="0 0 ${W} ${H}" style="width:100%"><path d="M${p.map(q=>q.join(',')).join('L')}" fill="none" stroke="${col}" stroke-width="2.5"/>${p.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${col}"/><text x="${q[0]}" y="${q[1]-9}" fill="#b9cbe0" font-size="11" text-anchor="middle">${v[i]}</text><text x="${q[0]}" y="${H-6}" fill="#8ea6c0" font-size="11" text-anchor="middle">${l[i]}</text>`).join('')}</svg>`};
const hbars=(it)=>{const m=Math.max(...it.map(i=>i.v),1);return it.map(i=>`<div style="display:flex;justify-content:space-between;font-size:13px"><span>${i.l}</span><b>${i.v}</b></div><div class="hb"><i style="width:${i.v/m*100}%;${i.c?'background:'+i.c:''}"></i></div>`).join('')};
const byM=a=>MON.map((_,i)=>a.filter(x=>x.m==i).length),mAn=a=>MON.map((_,i)=>a.filter(x=>x.m==i&&x.s>=TH).length);
const pill=p=>`<span class="tag ${p}">${p}</span>`;
function csv(a){return['id,wilayah,kategori,tanggal,skor_anomali,prioritas,status,sumber'].concat(a.map(x=>[x.id,x.reg,CN[x.cat],dt(x),x.s,x.p,x.ver,'SIMULASI'].map(v=>`"${v}"`).join(','))).join('\n')}
// ===== PAGES =====
const P={
beranda(){const a=D;return`<section class="hero"><div><span class="demo">PROTOTYPE KONSEPTUAL</span><h1 style="margin-top:14px">Menjaga Kedaulatan Indonesia Melalui <span class="hl">Kekuatan Data dan Teknologi.</span></h1><p style="font-size:17px">Mengintegrasikan kecerdasan buatan, analisis data, dan teknologi geospasial untuk mendukung pemantauan wilayah dan pengambilan keputusan nasional.</p><button class="btn" onclick="location.hash='dashboard'">Jelajahi Platform</button><button class="btn o" onclick="location.hash='inovasi'">Pelajari Inovasi</button></div><div class="pn" style="padding:10px">${mapSVG(a,{net:1})}</div></section>
<div class="g g3"><div class="pn"><h3>Peta Digital</h3><p>Pantau titik aktivitas simulasi dari Sabang sampai Merauke dengan filter dan popup.</p><button class="btn s" onclick="location.hash='peta'">Buka peta</button></div><div class="pn"><h3>Analisis AI</h3><p>Skor anomali bergaya Isolation Forest dengan penjelasan yang dapat dibaca manusia.</p><button class="btn s" onclick="location.hash='analisis'">Lihat analisis</button></div><div class="pn"><h3>Peringatan Dini</h3><p>Notifikasi LOW/MEDIUM/HIGH, selalu berupa indikasi yang perlu verifikasi.</p><button class="btn s" onclick="location.hash='peringatan'">Lihat peringatan</button></div></div>`},
dashboard(){const a=flt(),an=a.filter(x=>x.s>=TH),cur=a.filter(x=>x.m==5).length,prv=a.filter(x=>x.m==4).length,d=cur-prv;
const st=(l,v,ds,ic,x='')=>`<div class="pn stat"><small>${ic} ${l}</small><b>${v}</b>${x}<div><small>${ds}</small></div></div>`;
const rs=REG.map((g,i)=>({l:g[0],v:a.filter(x=>x.r==i).length}));
return`<h2>Dashboard Utama</h2><p>Ringkasan dataset simulasi. Semua angka berasal dari 64 catatan SIMULASI yang sama di seluruh halaman.</p>${bar()}
<div class="g g4">${st('Wilayah Pemantauan',new Set(a.map(x=>x.r)).size+' / 8','Wilayah dengan catatan (data demo)','◎')}${st('Aktivitas Terdeteksi',a.length,'Catatan dalam dataset terfilter','◈',`<span class="${d>0?'up':'dn'}">${d>=0?'▲':'▼'} ${Math.abs(d)} vs bulan lalu</span>`)}${st('Indikasi Anomali',an.length,'Skor ≥ ambang '+TH.toFixed(2)+' · perlu verifikasi','△',`<span class="up">${a.length?Math.round(an.length/a.length*100):0}% dari total</span>`)}${st('Status Sistem','Prototype','Model: simulasi · API: belum terhubung','●')}</div>
<div class="g g2" style="margin-top:16px"><div class="pn"><h3>Aktivitas berdasarkan waktu</h3>${line(byM(a),MON)}</div><div class="pn"><h3>Tingkat indikasi anomali per bulan</h3>${line(mAn(a),MON,'#ef4444')}</div>
<div class="pn"><h3>Distribusi berdasarkan kategori</h3>${hbars(CAT.map(c=>({l:c[1],v:a.filter(x=>x.cat==c[0]).length,c:c[2]})))}</div><div class="pn"><h3>Ringkasan wilayah</h3>${hbars(rs)}</div></div>`},
peta(){const a=flt({layers:1});return`<h2>Peta Digital Indonesia</h2><p>Klik titik untuk melihat detail. Klik legenda untuk menyalakan/mematikan layer. Tidak ada fasilitas militer atau titik sensitif yang ditampilkan.</p>${bar()}<div class="g mapw"><div class="pn" style="padding:10px">${mapSVG(a)}<div class="lg" id="lg">${CAT.map(c=>`<span data-l="${c[0]}" class="${F.hid.has(c[0])?'off':''}"><i class="dot" style="background:${c[2]}"></i>${c[1]}</span>`).join('')}</div></div><div class="pn" id="side"><h3>Panel informasi</h3><p>${a.length} titik tampil. Pilih sebuah marker.</p></div></div>`},
analisis(){const a=flt(),an=a.filter(x=>x.s>=TH).sort((x,y)=>y.s-x.s);
let sc=`<svg viewBox="0 0 520 220" style="width:100%"><line x1="30" x2="510" y1="${200-TH*180}" y2="${200-TH*180}" stroke="#ef4444" stroke-dasharray="4"/><text x="34" y="${194-TH*180}" fill="#fca5a5" font-size="10">ambang ${TH.toFixed(2)}</text>`+a.map(x=>`<circle cx="${30+x.f[0]*470}" cy="${200-x.s*180}" r="4.5" fill="${x.s>=TH?'#ef4444':'#22d3ee'}" opacity=".8"/>`).join('')+`<text x="30" y="216" fill="#8ea6c0" font-size="10">frekuensi relatif →</text><text x="4" y="12" fill="#8ea6c0" font-size="10">skor</text></svg>`;
return`<h2>AI Threat Detection – Deteksi Dini</h2><div class="note"><b>Status transparan:</b> model belum terhubung ke data nyata. Skor dihitung di browser dari tiga fitur simulasi dengan bobot tetap, sebagai ilustrasi konsep <i>Isolation Forest</i> (rancangan produksi: scikit-learn via FastAPI). Hasil adalah <b>indikasi anomali</b>, bukan bukti pelanggaran.</div>${bar()}
<div class="g g2"><div class="pn"><h3>Pola normal vs tidak normal</h3>${sc}<label style="font-size:13px">Ambang anomali: <input type="range" id="th" min=".3" max=".9" step=".05" value="${TH}"> <b>${TH.toFixed(2)}</b></label><br><button class="btn s" id="run" style="margin-top:10px">Jalankan analisis simulasi</button></div>
<div class="pn"><h3>Klasifikasi prioritas</h3>${hbars(['HIGH','MEDIUM','LOW'].map(p=>({l:p,v:a.filter(x=>x.p===p).length,c:p==='HIGH'?'#ef4444':p==='MEDIUM'?'#fbbf24':'#2dd4bf'})))}<h3 style="margin-top:14px">Riwayat analisis</h3>${RUNS.slice().reverse().map(r=>`<div style="font-size:13px;color:#b9cbe0">• ${r.t}: ${r.n} indikasi (ambang ${r.th||.6})</div>`).join('')}</div></div>
<h3 style="margin:18px 0 8px">Indikasi teratas & penjelasan</h3>${an.slice(0,6).map(x=>`<div class="pn al ${x.p}"><b>${x.id}</b> · ${x.reg} · ${CN[x.cat]} ${pill(x.p)} <b style="float:right">skor ${x.s}</b><p style="margin:8px 0 4px"><b>Mengapa ditandai:</b> ${FEAT[x.f.indexOf(Math.max(...x.f))]} (kontribusi ${Math.round(Math.max(...x.f)*100)}%). Perlu verifikasi lebih lanjut.</p><div class="hb"><i style="width:${x.s*100}%"></i></div><small style="color:#8ea6c0">Rekomendasi: ${REC[x.cat]}</small></div>`).join('')||'<p>Tidak ada indikasi pada filter ini.</p>'}`},
data(){const a=flt(),srcs=[['BIG','Data geospasial dasar & batas wilayah'],['BPS','Statistik wilayah & infrastruktur'],['BMKG','Data cuaca & lingkungan'],['Portal Satu Data Indonesia','Dataset terbuka pemerintah']];
return`<h2>Pusat Analisis Data Nasional</h2><div class="note">Contoh rancangan integrasi. <b>Belum ada koneksi API aktif</b>; seluruh isi tabel adalah data SIMULASI, bukan data resmi.</div>${bar()}<div class="g g4">${srcs.map(s=>`<div class="pn"><h3>${s[0]}</h3><p style="font-size:13px">${s[1]}</p><span class="tag MEDIUM">Contoh integrasi · belum terhubung</span></div>`).join('')}</div>
<div class="g g2" style="margin-top:16px"><div class="pn"><h3>Tren catatan per bulan</h3>${line(byM(a),MON)}</div><div class="pn"><h3>Jenis data (simulasi)</h3>${hbars(CAT.map(c=>({l:c[1],v:a.filter(x=>x.cat==c[0]).length,c:c[2]})))}<p style="font-size:12px;color:#8ea6c0">Pembaruan terakhir: 31 Okt 2026 (waktu dataset simulasi) · Validasi: ${a.filter(x=>x.ver.startsWith('Terv')).length}/${a.length} tervalidasi (simulasi)</p></div></div>
<div class="pn tw" style="margin-top:16px"><table><tr><th>ID</th><th>Wilayah</th><th>Kategori</th><th>Tanggal</th><th>Sumber</th><th>Validasi</th></tr>${a.slice(0,25).map(x=>`<tr><td>${x.id}</td><td>${x.reg}</td><td>${CN[x.cat]}</td><td>${dt(x)}</td><td>SIMULASI</td><td>${x.ver}</td></tr>`).join('')}</table><p style="font-size:12px;margin-top:8px">Menampilkan 25 dari ${a.length} catatan.</p></div>`},
peringatan(){const a=flt().filter(x=>(!F.pp||x.p===F.pp)&&(!F.ss||x.st===F.ss)).sort((x,y)=>y.s-x.s).slice(0,20);
const ex=`<select id="pp"><option value="">Semua prioritas</option>${['HIGH','MEDIUM','LOW'].map(p=>`<option${F.pp==p?' selected':''}>${p}</option>`).join('')}</select><select id="ss"><option value="">Semua status</option>${['Baru','Dalam verifikasi','Selesai'].map(p=>`<option${F.ss==p?' selected':''}>${p}</option>`).join('')}</select>`;
return`<h2>Early Warning System</h2><p>LOW: dalam batas pola normal · MEDIUM: perubahan pola perlu diperhatikan · HIGH: indikasi anomali, perlu verifikasi lebih lanjut.</p>${bar(ex)}${a.map(x=>`<div class="pn al ${x.p}"><b>${x.id}</b> ${pill(x.p)} <span style="float:right;font-size:12px;color:#8ea6c0">${dt(x)} · status: <b>${x.st}</b></span><p style="margin:6px 0"><b>${x.reg}</b> · ${CN[x.cat]}<br>Ringkasan: indikasi anomali skor ${x.s}; ${FEAT[x.f.indexOf(Math.max(...x.f))].toLowerCase()}.<br><small style="color:#8ea6c0">Rekomendasi verifikasi: ${REC[x.cat]}</small></p><button class="btn s" data-st="${x.id}">Ubah status ▸</button></div>`).join('')||'<p>Tidak ada notifikasi.</p>'}<h3>Riwayat notifikasi</h3><div class="pn">${LOG.slice().reverse().slice(0,8).map(l=>`<div style="font-size:13px">• ${l}</div>`).join('')||'<small>Belum ada perubahan status.</small>'}</div>`},
laporan(){const a=F.per!==''?D:D,A=+(F.pa??4),B=+(F.pb??5),ca=c=>D.filter(x=>x.m==A&&x.cat==c).length,cb=c=>D.filter(x=>x.m==B&&x.cat==c).length;
return`<h2>Report & Decision Support</h2><p>Rekomendasi bersifat informatif sebagai bahan pertimbangan pihak berwenang, <b>bukan keputusan otomatis</b>.</p><div class="bar"><select id="pa">${MON.map((m,i)=>`<option value="${i}"${i==A?' selected':''}>Periode A: ${m}</option>`).join('')}</select><select id="pb">${MON.map((m,i)=>`<option value="${i}"${i==B?' selected':''}>Periode B: ${m}</option>`).join('')}</select><button class="btn s" id="dl">Unduh CSV</button><button class="btn s o" id="cp">Salin CSV</button><button class="btn s o" onclick="print()">Cetak / Simpan PDF</button></div>
<div class="g g2"><div class="pn"><h3>Perbandingan aktivitas antarperiode</h3><table><tr><th>Kategori</th><th>${MON[A]}</th><th>${MON[B]}</th><th>Δ</th></tr>${CAT.map(c=>`<tr><td>${c[1]}</td><td>${ca(c[0])}</td><td>${cb(c[0])}</td><td>${cb(c[0])-ca(c[0])>0?'▲':'▼'} ${Math.abs(cb(c[0])-ca(c[0]))}</td></tr>`).join('')}</table></div><div class="pn"><h3>Grafik hasil analisis</h3>${line(byM(D),MON)}${line(mAn(D),MON,'#ef4444')}</div></div>
<div class="pn" style="margin-top:16px"><h3>Rekomendasi berdasarkan kategori</h3>${CAT.map(c=>`<p><b style="color:${c[2]}">${c[1]}:</b> ${REC[c[0]]}</p>`).join('')}</div><p id="cmsg" style="font-size:12px;color:var(--am)"></p>`},
inovasi(){const S=[['1. Latar belakang','Ancaman terhadap kedaulatan kini mencakup ruang digital, maritim, dan sumber daya alam di wilayah kepulauan yang luas.'],['2. Mengapa AI, Big Data, GIS','Luas wilayah menuntut pemantauan berbasis pola data; GIS memberi konteks ruang, AI menyaring anomali dari data besar.'],['3. Masalah yang diselesaikan','Data tersebar di banyak instansi, sulit dibandingkan, dan lambat dianalisis secara terpadu.'],['4. Kebaruan','Satu antarmuka geospasial dengan skor anomali yang dapat dijelaskan, serta bahasa temuan yang berhati-hati: indikasi, bukan vonis.'],['5. Cara kerja','Data terbuka/resmi diintegrasikan, dibersihkan, dianalisis model, lalu divisualisasikan dan diubah menjadi peringatan dini.'],['6. Sasaran pengguna','Analis instansi berwenang, peneliti, pemerintah daerah, akademisi, dan komunitas inovator.'],['7. Tahapan implementasi','Prototipe (data simulasi) → Uji dengan data terbuka (BIG, BPS, BMKG) → Pilot bersama instansi → Skala nasional.'],['8. Dampak diharapkan','Respons lebih cepat, keputusan berbasis data, dan kemandirian teknologi nasional.']];
return`<h2>Tentang Inovasi NUSANTARA GUARD</h2><div class="flow">${['Pengumpulan Data','Integrasi Data','Data Cleaning','Analisis AI','Deteksi Anomali','Visualisasi Geospasial','Peringatan Dini','Rekomendasi Keputusan'].map((s,i,r)=>`<div>${s}</div>${i<r.length-1?'<em>→</em>':''}`).join('')}</div><div class="g g2" style="margin-top:18px">${S.map(s=>`<div class="pn"><h3 class="hl">${s[0]}</h3><p>${s[1]}</p></div>`).join('')}</div>
<div class="pn" style="margin-top:18px;border-color:var(--cy)"><h2 class="hl">GENERASI MUDA, PAHLAWAN DI ERA DIGITAL</h2><p>Pahlawan masa kini berjuang dengan pengetahuan. Generasi muda dapat berkontribusi sebagai <b>pengembang teknologi, data scientist, peneliti, analis, dan inovator</b> yang menghasilkan solusi nyata bagi kepentingan bangsa.</p></div>
<div class="pn" style="margin-top:16px"><h3>Arsitektur pengembangan</h3><p>Frontend React/Next.js + Tailwind + Recharts · Peta Leaflet · Backend Python FastAPI · PostgreSQL + PostGIS · Machine learning scikit-learn. <i>Prototipe ini berupa satu halaman statis dengan data simulasi.</i></p></div>`}};
const NAV=[['beranda','Beranda'],['dashboard','Dashboard'],['peta','Peta Digital'],['analisis','Analisis AI'],['data','Data Nasional'],['peringatan','Peringatan Dini'],['laporan','Laporan'],['inovasi','Tentang Inovasi']];
function render(keep){const h=(location.hash||'#beranda').slice(1),k=P[h]?h:'beranda';$('#nav').innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]==k?'on':''}">${n[1]}</a>`).join('');$('#m').innerHTML=`<div class="pg on">${P[k]()}</div>`;if(!keep)scrollTo(0,0);
if($('#fq'))bindBar();
if($('#th'))$('#th').onchange=e=>{TH=+e.target.value;render(true)};if($('#run'))$('#run').onclick=()=>{RUNS.push({t:'Analisis ulang '+new Date().toLocaleTimeString('id-ID'),n:D.filter(x=>x.s>=TH).length,th:TH.toFixed(2)});render(true)};
if($('#pp'))$('#pp').onchange=e=>{F.pp=e.target.value;render(true)};if($('#ss'))$('#ss').onchange=e=>{F.ss=e.target.value;render(true)};
if($('#pa')){$('#pa').onchange=e=>{F.pa=e.target.value;render(true)};$('#pb').onchange=e=>{F.pb=e.target.value;render(true)};
$('#cp').onclick=()=>{const t=csv(D);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>$('#cmsg').textContent='CSV disalin ke clipboard.').catch(()=>$('#cmsg').textContent='Salin gagal di lingkungan ini.')};
$('#dl').onclick=()=>{try{const u=URL.createObjectURL(new Blob([csv(D)],{type:'text/csv'})),l=document.createElement('a');l.href=u;l.download='nusantara-guard-simulasi.csv';l.click();$('#cmsg').textContent='Jika unduhan tidak dimulai (dibatasi lingkungan pratinjau), gunakan “Salin CSV”.'}catch(e){$('#cmsg').textContent='Gunakan “Salin CSV”.'}}}
if($('#lg'))$('#lg').onclick=e=>{const c=e.target.closest('[data-l]');if(!c)return;F.hid.has(c.dataset.l)?F.hid.delete(c.dataset.l):F.hid.add(c.dataset.l);render(true)}}
document.addEventListener('click',e=>{const m=e.target.closest('[data-id]');if(m&&$('#side')){const x=D.find(d=>d.id===m.dataset.id);$('#side').innerHTML=`<h3>${x.id} ${pill(x.p)}</h3><p><b>Wilayah:</b> ${x.reg} – ${x.place}<br><b>Kategori:</b> ${CN[x.cat]}<br><b>Tanggal pencatatan:</b> ${dt(x)}<br><b>Sumber data:</b> SIMULASI (bukan data resmi)<br><b>Status verifikasi:</b> ${x.ver}</p><p><b>Hasil analisis:</b> skor anomali ${x.s}. ${x.s>=TH?'Indikasi anomali; perlu verifikasi lebih lanjut. '+FEAT[x.f.indexOf(Math.max(...x.f))]+'.':'Dalam batas pola normal.'}</p>`}
const b=e.target.closest('[data-st]');if(b){const x=D.find(d=>d.id===b.dataset.st),o=['Baru','Dalam verifikasi','Selesai'];x.st=o[(o.indexOf(x.st)+1)%3];LOG.push(`${new Date().toLocaleTimeString('id-ID')} · ${x.id} → ${x.st}`);render(true)}});
addEventListener('hashchange',()=>render());render();
</script></body></html>
